# RentalHRM edge proxy
#
# Sits in front of the app container and exists for exactly one reason: users must
# never hit a browser connection error ("this site can't be reached") while the app
# is stopped for an update. This container keeps running through the whole
# maintenance window and answers with the maintenance page whenever the app behind
# it is unreachable.
#
# Two possible maintenance pages, tried in order:
#   1. /var/www/maintenance/maintenance.html — written by the app itself when the
#      Super Admin turns maintenance mode on (shared Docker volume), so it carries
#      their custom message.
#   2. /var/www/maintenance-default/maintenance.html — the neutral built-in notice,
#      used for unplanned outages (crash, host reboot, forgotten maintenance mode).

# Pass WebSocket upgrades through untouched; a plain proxy would break them.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    # Contract/QR uploads are capped at 10MB by next.config.js — leave headroom for
    # the multipart envelope so the app (not nginx) is what reports oversized files.
    client_max_body_size 12m;

    # Docker's embedded DNS server. Resolving the upstream through a *variable*
    # (instead of a literal host name) is what lets nginx start and keep running
    # while the `app` container doesn't exist at all — with a literal name, nginx
    # refuses to start with "host not found in upstream".
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $app_upstream "app:3000";
        # $request_uri keeps the original path + query byte-for-byte, so encoded
        # characters in /uploads/... URLs survive the hop.
        proxy_pass http://$app_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Fail over to the maintenance page quickly when the app is down, but stay
        # patient once it has answered — PDF/backup generation can take a while.
        proxy_connect_timeout 3s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Next.js streams its HTML/RSC responses; buffering them here would stall
        # pages on their loading skeleton.
        proxy_buffering off;
    }

    # Only nginx's *own* errors land here (proxy_intercept_errors stays off), i.e.
    # the app is unreachable or timed out — never a 503 the app deliberately sent.
    error_page 502 503 504 =503 @maintenance;

    location @maintenance {
        root /var/www/maintenance;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 60 always;
        try_files /maintenance.html @maintenance_default;
    }

    location @maintenance_default {
        root /var/www/maintenance-default;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 60 always;
        try_files /maintenance.html =503;
    }
}
