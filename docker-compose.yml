services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rentalhrm:latest
    restart: unless-stopped
    # Deliberately not published on the host: the `proxy` service in front of it is
    # what listens on APP_PORT, so visitors keep getting a maintenance page instead
    # of a connection error while this container is stopped for an update.
    expose:
      - "3000"
    environment:
      # The SQLite file lives on the db-data volume, not inside the image.
      # SQLite permits only one writer. Keep Prisma on one connection so bursts
      # of server-rendered requests queue instead of competing until P1008.
      DATABASE_URL: "file:/app/data/prod.db?connection_limit=1"
      AUTH_SECRET: "${AUTH_SECRET:?Set AUTH_SECRET in .env.docker — see .env.docker.example}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      ALLOW_SELF_SIGNUP: "${ALLOW_SELF_SIGNUP:-false}"
      # Uploaded files are stored here (a persistent volume) and served by the
      # app's /uploads route — deliberately NOT under public/, which Next.js only
      # scans once at boot, so new uploads 404 until the container is restarted.
      UPLOADS_DIR: "/app/data/uploads"
      # Maintenance mode's on-disk mirror: the flag `src/proxy.ts` reads on every
      # request, plus the ready-to-serve maintenance.html the nginx container falls
      # back to while this container is stopped. Shared with `proxy` as a volume.
      MAINTENANCE_DIR: "/app/data/maintenance"
      # Extra hostnames this deployment is served on, beyond NEXTAUTH_URL. Needed
      # when a reverse proxy (Cloudflare Tunnel, nginx, ...) rewrites the Host
      # header, otherwise Next.js rejects Server Actions as cross-origin.
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
    volumes:
      # Persist the SQLite database across container restarts/rebuilds.
      - db-data:/app/data
      # Persist uploaded contract documents / payment QR images across restarts and
      # rebuilds. Previously mounted at /app/public/uploads; the volume contents are
      # unchanged, so existing files keep resolving from their stored /uploads/... URLs.
      - uploads-data:/app/data/uploads
      # Maintenance flag + generated maintenance page, read by the proxy container.
      - maintenance-data:/app/data/maintenance
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Always-on front door. Keep this container running during updates (see
  # `npm run docker:stop` / `docker:update`): it proxies everything to `app` while
  # that is up, and serves the maintenance page — with the Super Admin's own message
  # when they enabled maintenance mode — the moment it isn't.
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Generated by the app when maintenance mode is turned on (preferred page).
      - maintenance-data:/var/www/maintenance:ro
      # Neutral built-in notice used for unplanned outages (fallback page).
      - ./docker/maintenance:/var/www/maintenance-default:ro

volumes:
  db-data:
  uploads-data:
  maintenance-data:
