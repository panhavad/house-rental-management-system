services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rentalhrm:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # The SQLite file lives on the db-data volume, not inside the image.
      DATABASE_URL: "file:/app/data/prod.db"
      AUTH_SECRET: "${AUTH_SECRET:?Set AUTH_SECRET in .env.docker — see .env.docker.example}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      ALLOW_SELF_SIGNUP: "${ALLOW_SELF_SIGNUP:-false}"
    volumes:
      # Persist the SQLite database across container restarts/rebuilds.
      - db-data:/app/data
      # Persist uploaded contract documents (PDF/image) across restarts/rebuilds.
      - uploads-data:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  db-data:
  uploads-data:
